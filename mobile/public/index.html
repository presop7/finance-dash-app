<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: use the whole iPhone screen (notch / home bar
         areas included); the app's own safe-area padding keeps content clear.
         maximum-scale=1: stops iPhone Safari zooming in on a text field when
         it's tapped (and staying zoomed after). Pinch-to-zoom still works —
         iOS always allows it for accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Fi-Track</title>
    <meta name="description" content="Track your income, spending and funds." />
    <meta name="theme-color" content="#17181c" />

    <!-- "Add to Home Screen": opens full-screen like an app, with this name
         and icon, instead of as a Safari/Chrome tab. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fi-Track" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #17181c;
      }
      /* The page itself never moves — only the app's own lists scroll.
         position: fixed is what actually stops iPhone Safari from dragging
         and bouncing the whole app around (overflow/overscroll alone don't). */
      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Hover feedback on computers: everything tappable (react-native-web
         makes every pressable focusable, tabindex="0") dims slightly under
         the mouse. Only with a real mouse — on phones a tap would leave it
         stuck "hovered". */
      @media (hover: hover) and (pointer: fine) {
        [tabindex="0"] {
          transition: opacity 0.12s ease;
        }
        [tabindex="0"]:hover {
          opacity: 0.8;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
